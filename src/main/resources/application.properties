spring.application.name=baozi-store
server.port=8080

# H2 e um banco RELACIONAL permitido pelo enunciado. O arquivo persiste entre execucoes.
spring.datasource.url=jdbc:h2:file:./baozi-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console opcional de consulta ao banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
